name: Build Stratechna Sign

# Sem rebuild agendado: a versão do DocuSeal está fixa no Dockerfile e só muda
# de propósito. O workflow upstream.yml abre um issue quando sai versão nova.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEM: ghcr.io/stratechna/stratechna-sign

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Versão fixada do DocuSeal
        id: v
        run: |
          V=$(sed -nE 's/^ARG DOCUSEAL_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)
          test -n "$V" || { echo "DOCUSEAL_VERSION não encontrada no Dockerfile"; exit 1; }
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"

      - name: Build (o aplicar.rb falha se alguma troca deixar de encaixar)
        run: docker build --pull -t sign:teste --label org.opencontainers.image.revision=${{ github.sha }} .

      - name: Verificar a marca e a atribuição na imagem construída
        run: bash branding/verificar.sh sign:teste

      - name: Publicar (só chega aqui se a verificação passou)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in ${{ steps.v.outputs.versao }} ${{ steps.v.outputs.minor }} latest; do
            docker tag sign:teste "$IMAGEM:$tag"
            docker push -q "$IMAGEM:$tag"
          done
